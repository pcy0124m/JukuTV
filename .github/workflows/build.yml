name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 不要用该 action 的默认 packages：它默认要装 "tools"，
      # 而新 cmdline-tools 已经移除该包 -> "Failed to find package 'tools'"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 电视直播模块靠 assets 里的两个文件活着（频道表 + 注入脚本）。
      # 少了它们 APK 能装能开，但一点「直播」就白屏 —— 静态检查看不出来，
      # 所以在 CI 里直接把 APK 拆开验一眼。
      - name: 校验直播资源已打进包
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "检查 $APK"
          unzip -l "$APK" | grep -E 'assets/(channels\.json|inject\.js)' || {
            echo "::error::APK 里缺少 assets/channels.json 或 assets/inject.js（电视直播会白屏）"
            exit 1
          }
          unzip -l "$APK" | grep -E 'assets/www/index\.html' || {
            echo "::error::APK 里缺少 assets/www/index.html"
            exit 1
          }
          echo "--- assets 清单 ---"
          unzip -l "$APK" | grep -E 'assets/' | head -40

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jukutv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
